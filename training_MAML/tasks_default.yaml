# Training task set — "payload magnitude" MAML experiment (option 1).
#
# Why this gives MAML a genuine edge over the joint baseline:
#   The per-task axis is the MASS MAGNITUDE (a CENTERED payload). The NN
#   replaced the firmware's integral velocity-Z loop, so the collective
#   thrust it must output to hold a given weight has NO integrator: a single
#   memoryless policy cannot hold tasks of different weight without a
#   per-task steady-state z error. MAML adapts the thrust bias per task; the
#   baseline must compromise on one bias -> residual droop spread = the gap.
#   (Offset *direction* is a poor axis: the inner attitude/rate PIDs, KI>0,
#   already integrate away a static CoM-offset torque — that is what made
#   the previous direction-only dataset give baseline == MAML.)
#
# Schema (single source of truth for the task distribution):
#   mass_pos_sigma : std [m] of the position Gaussians (≈0 -> exactly centered)
#   half_side      : half-side [m] of the start cube (small -> start near the
#                    setpoint, so the cost is dominated by the HOLDING phase
#                    where the per-task thrust difference shows up)
#   mass_value_gaussians : pool of 1-D magnitude Gaussians {mean, std} [kg],
#                    clamped >= 0; tasks pick into it via `mass_values`
#   tasks[*].mass_gaussians : position-Gaussian indices 1..5
#                    (1..4 = motors M1..M4, 5 = drone centre)
#   tasks[*].octants        : start octants 1..8 (sign of x,y,z)
#   tasks[*].mass_values    : 1-based indices into mass_value_gaussians
#
# Here: 3 distinct centered payloads (~3 / 8 / 13 g), each its own crisp
# (low-std) magnitude Gaussian; held-out target = 11 g (interpolable).
mass_pos_sigma: 0.001
half_side:      0.1
mass_value_gaussians:
  - {mean: 0.003, std: 0.0005}   # 1: light
  - {mean: 0.008, std: 0.0005}   # 2: medium
  - {mean: 0.013, std: 0.0005}   # 3: heavy
tasks:
  - name: light
    mass_gaussians: [5]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
    mass_values:    [1]
  - name: medium
    mass_gaussians: [5]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
    mass_values:    [2]
  - name: heavy
    mass_gaussians: [5]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
    mass_values:    [3]
