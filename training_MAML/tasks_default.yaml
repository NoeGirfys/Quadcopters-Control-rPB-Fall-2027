# Training task set for the offset-mass MAML experiment.
#
# Design rationale — why this gives MAML a genuine edge over the joint
# baseline (it did NOT with the previous no-mass / octant-only set):
#   * The ONLY axis that varies across tasks is the DIRECTION of the
#     attached offset mass. Each task pins the mass to a single motor
#     corner, so each task has a different steady-state compensation
#     torque -> a different optimal policy.
#   * The mass magnitude is FIXED and heavy (set --mass-min == --mass-max
#     on the CLI, e.g. 10 g ~ 34% of the 29 g body).
#   * The start region is COMMON to every task (all 8 octants, small
#     --half-side), so the initial condition does NOT identify the task —
#     only the (unobservable) offset does.
#   * The per-task mass position is tight (small --mass-pos-sigma) so each
#     task has a crisp, well-separated optimum.
# A single memoryless policy cannot null opposite-corner torques at once,
# so the baseline must compromise (steady-state droop on every task);
# MAML adapts the per-task bias few-shot and wins.
#
# Encoding:
#   mass_gaussians : motor indices 1..4
#                      M1 = front-right (+x, -y)
#                      M2 = rear-right  (-x, -y)
#                      M3 = rear-left   (-x, +y)
#                      M4 = front-left  (+x, +y)
#                    A selected motor contributes an isotropic 3-D Gaussian
#                    around its position (std = --mass-pos-sigma).
#   octants        : drone-start octants 1..8, indexed by the sign of
#                    (x, y, z); same list for every task here so the start
#                    distribution is shared.
#
# Holds out motor M4 (front-left, +x+y) for the target task
# (see target_default.yaml): an OOD offset direction that is still
# interpolable from M1/M2/M3, so few-shot adaptation can reach it.
# M1 and M3 are opposite corners -> maximal conflict for the baseline.
tasks:
  - name: M1
    mass_gaussians: [1]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
  - name: M2
    mass_gaussians: [2]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
  - name: M3
    mass_gaussians: [3]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
