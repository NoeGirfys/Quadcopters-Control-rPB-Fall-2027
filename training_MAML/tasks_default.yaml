# Example training task set for the composite MAML run.
#
# Encoding:
#   mass_gaussians : list of motor indices 1..4
#                      M1 = front-right (+x, -y)
#                      M2 = rear-right  (-x, -y)
#                      M3 = rear-left   (-x, +y)
#                      M4 = front-left  (+x, +y)
#                    Each selected motor contributes an isotropic 3-D
#                    Gaussian around its position (std = --mass-pos-sigma).
#
#   octants        : list of drone-start octants 1..8 in the cube of
#                    half-side --half-side, indexed by the sign of (x, y, z):
#                      1: (+,+,+)   2: (-,+,+)   3: (+,-,+)   4: (-,-,+)
#                      5: (+,+,-)   6: (-,+,-)   7: (+,-,-)   8: (-,-,-)
#
# A point of a task is drawn by picking one selected gaussian and one
# selected octant uniformly at random; the mass magnitude is the shared
# 1-D uniform [mass_min, mass_max].
#
# This default holds out gaussian 4 (motor M4) AND octant 8 (-,-,-) for
# the target task (see target_default.yaml).
tasks:
  - name: G1
    mass_gaussians: [1]
    octants:        [1, 2, 3, 4, 5, 6, 7]
  - name: G2
    mass_gaussians: [2]
    octants:        [1, 2, 3, 4, 5, 6, 7]
  - name: G3
    mass_gaussians: [3]
    octants:        [1, 2, 3, 4, 5, 6, 7]
