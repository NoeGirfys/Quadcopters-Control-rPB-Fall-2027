# Target (held-out) task for the offset-mass MAML experiment.
#
# Same schema as tasks_default.yaml. The mass is pinned to motor M4
# (front-left, +x+y) — a direction never used during training, but
# reachable by interpolating M1/M2/M3, so it is a genuine OOD few-shot
# generalisation test. The start region (all 8 octants) and the mass
# magnitude are identical to training, so the ONLY held-out factor is the
# offset direction. Its loss after K-shot adaptation is logged every epoch
# but never feeds the optimiser.
tasks:
  - name: target_M4
    mass_gaussians: [4]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
