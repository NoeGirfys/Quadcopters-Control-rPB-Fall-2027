# Target (held-out) task — "payload magnitude" MAML experiment (option 1).
#
# Same schema as tasks_default.yaml. The held-out factor is the payload
# MAGNITUDE: 11 g, a centered weight never seen in training but interpolable
# between the medium (8 g) and heavy (13 g) training tasks — a genuine OOD
# few-shot test. Start region (8 octants, half_side) matches training so the
# only held-out axis is the weight. Its loss after K-shot adaptation is
# logged every epoch but never feeds the optimiser.
mass_pos_sigma: 0.001
half_side:      0.1
mass_value_gaussians:
  - {mean: 0.018, std: 0.0005}   # held-out magnitude
tasks:
  - name: target_m18
    mass_gaussians: [5]
    octants:        [1, 2, 3, 4, 5, 6, 7, 8]
    mass_values:    [1]
