# Target (held-out) task for the composite MAML run.
#
# Same schema as tasks_default.yaml. This default picks distributions
# the training set never uses — gaussian 4 (motor M4, front-left) and
# octant 8 (-,-,-) — so the target loss is a genuine OOD test.
tasks:
  - name: target_O5678
    mass_gaussians: [1, 2, 3, 4]
    octants:        [5, 6, 7, 8]
